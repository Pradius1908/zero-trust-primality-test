<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<h1>
Zero Trust Dashboard
</h1>

<div class="row mt-4">

<div class="col-md-4">

<div class="card bg-secondary">

<div class="card-body">

<h5>
Certificates Issued
</h5>

<h2>

{{ users|length }}

</h2>

</div>

</div>

</div>

</div>

<h3 class="mt-5">

Registered Certificates

</h3>

<table
class="table table-dark table-striped mt-3">

<thead>

<tr>

<th>User</th>
<th>Public N</th>
<th>Exponent</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.username }}</td>
<td>{{ user.n }}</td>
<td>{{ user.e }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<a
href="/"
class="btn btn-primary">

Home

</a>

</div>

</body>
</html>
