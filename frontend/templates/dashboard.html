<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<h1>
System Dashboard
</h1>

<div class="row mt-4">

<div class="col-md-4">

<div class="card bg-secondary">

<div class="card-body">

<h5>
Registered Users
</h5>

<h2>
{{ stats.users }}
</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-secondary">

<div class="card-body">

<h5>
Authentication Attempts
</h5>

<h2>
{{ stats.attempts }}
</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card bg-secondary">

<div class="card-body">

<h5>
Successful Logins
</h5>

<h2>
{{ stats.success }}
</h2>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
